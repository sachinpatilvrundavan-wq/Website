<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Page Title</title>
  
  <!-- Basic CSS Reset & Starter Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
      padding: 2rem;
    }

    header {
      max-width: 800px;
      margin: 0 auto 2rem auto;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    footer {
      max-width: 800px;
      margin: 2rem auto 0 auto;
      text-align: center;
      font-size: 0.875rem;
      color: #666;
    }

    h1 {
      color: #111;
      margin-bottom: 0.5rem;
    }

    p {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple, modern HTML boilerplate.</p>
  </header>

  <main>
    <h2>Main Content Area</h2>
    <p>Start adding your content, components, or layout elements here.</p>
  </main>

  <footer>
    <p>&copy; 2026 Your Name or Brand</p>
  </footer>

  <!-- External or Inline JavaScript -->
  <script>
    console.log("Script loaded successfully!");
  </script>
</body>
</html>
